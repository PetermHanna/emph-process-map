# Publishes the demo (the Process Map with in-memory data) to the gh-pages branch, which GitHub Pages serves.
# Built from files already in the repository: the component bundle is the committed one in map/sol, so run
# .\map\build.ps1 and commit before pushing a change.
name: Demo site

on:
  push:
    branches: [main]
    paths: ["map/harness/site/**", "map/harness/local/mock.js", "map/sol/Controls/**", "map/schema/sample-data.js", "map/schema/catalog.json", "map/schema/flows.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp map/harness/site/index.html _site/index.html
          cp map/harness/local/mock.js _site/
          cp map/sol/Controls/emph_EMPH.ProcessMap/bundle.js _site/
          cp map/schema/sample-data.js map/schema/catalog.json map/schema/flows.json _site/
          touch _site/.nojekyll
          ls -l _site
      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
